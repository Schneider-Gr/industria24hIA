name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    # gitleaks-action lista os commits do PR via API (GET /pulls/:n/commits);
    # sem este escopo o job falha sempre com 403, mascarando o gate real.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks (falha o CI se achar segredo)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Achado de auditoria OWASP (#3, médio): sem isso, uma dependência com
      # CVE High/Critical (como o próprio next@16.2.10 antes do fix) só é
      # descoberta manualmente. `npm audit` já usa o lockfile do `npm ci`
      # acima, sem instalar nada de novo.
      - run: npm audit --audit-level=high

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run test

  migrations-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Migrations vivem soltas em supabase/migrations com prefixo numérico
      # manual (sem `supabase migration new`) — já colidiu antes entre
      # worktrees (branch fix/renumerar-migration-0030-colisao). Falha o CI
      # se dois arquivos usarem o mesmo prefixo de 4 dígitos.
      - name: Verificar colisão de número de migration
        run: |
          cd supabase/migrations
          dups=$(ls | grep -oE '^[0-9]{4}' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "Números de migration duplicados: $dups"
            exit 1
          fi
