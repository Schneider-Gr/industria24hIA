name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Negar por padrão: o GITHUB_TOKEN nasce só-leitura; nenhum job aqui escreve
# no repo. Auditoria de segurança 2026-07-21.
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks (falha o CI se achar segredo)
        uses: gitleaks/gitleaks-action@v2

  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  migrations-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Migrations vivem soltas em supabase/migrations com prefixo numérico
      # manual (sem `supabase migration new`) — já colidiu antes entre
      # worktrees (branch fix/renumerar-migration-0030-colisao). Falha o CI
      # se dois arquivos usarem o mesmo prefixo de 4 dígitos.
      - name: Verificar colisão de número de migration
        run: |
          cd supabase/migrations
          dups=$(ls | grep -oE '^[0-9]{4}' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "Números de migration duplicados: $dups"
            exit 1
          fi
